<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA: Pоimай Квадрат</title>

<!-- Подключаем легендарный шрифт Pricedown (GTA) -->
<link href="https://fonts.googleapis.com/css2?family=Pricedown&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto Condensed', sans-serif;
    background: #000;
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; user-select: none;
    transition: background 0.5s;
    background-image: radial-gradient(circle at 50% 0%, #2a1a00, #000 70%);
  }
  
  /* GTA Шрифты */
  .gta-font { font-family: 'Pricedown', 'Arial Black', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
  
  h1 { font-size: 2.5rem; margin-bottom: 6px; color: #f39c12; text-shadow: 3px 3px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; text-align: center; }
  .sub { font-size: 1rem; color: #bbb; margin-bottom: 14px; text-align: center; font-style: italic; }

  /* Верхняя панель */
  #topPanel { width: 90vw; max-width: 500px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 10px; min-height: 30px; }
  .auth-btn { background: #222; color: #f39c12; border: 2px solid #f39c12; padding: 6px 14px; border-radius: 0; font-size: 1rem; font-family: 'Pricedown', sans-serif; cursor: pointer; font-weight: bold; transition: all 0.2s; text-transform: uppercase; box-shadow: 2px 2px 0 #000; }
  .auth-btn:hover { background: #f39c12; color: #000; }
  .user-profile { font-size: 1rem; color: #ccc; display: flex; align-items: center; gap: 10px; font-weight: bold; }
  .user-profile b { color: #f39c12; font-size: 1.2rem; font-family: 'Pricedown', sans-serif; }

  /* HUD (в игре) */
  #hud { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  .stat { background: rgba(0, 0, 0, 0.8); border: 2px solid #444; border-radius: 0; padding: 8px 16px; text-align: center; min-width: 80px; box-shadow: inset 0 0 10px #000; }
  .stat .label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 1.4rem; font-weight: bold; color: #f39c12; font-family: 'Pricedown', sans-serif; }

  #timebar-wrap { width: 90vw; max-width: 500px; height: 12px; background: #222; border-radius: 0; overflow: hidden; margin-bottom: 10px; border: 2px solid #444; }
  #timebar { height: 100%; width: 100%; background: #f39c12; transition: width 0.1s linear; }

  #controlBar { width: 90vw; max-width: 500px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; min-height: 40px; }
  #comboBadge { background: #e74c3c; color: #fff; padding: 8px 16px; font-weight: bold; font-size: 1rem; opacity: 0; transform: translateY(-4px); transition: all 0.2s; border: 2px solid #fff; font-family: 'Pricedown', sans-serif; }
  #comboBadge.show { opacity: 1; transform: translateY(0); }
  #controlsRight { display: flex; gap: 8px; margin-left: auto; }
  #controlsRight button { padding: 8px 14px; font-size: 0.9rem; background: #222; color: #fff; border: 2px solid #f39c12; border-radius: 0; cursor: pointer; font-weight: bold; transition: background 0.2s; font-family: 'Pricedown', sans-serif; }
  #controlsRight button:hover { background: #f39c12; color: #000; }

  /* Арена */
  #arena { position: relative; width: 90vw; max-width: 500px; height: 500px; max-height: 55vh; background: #111; border: 4px solid #f39c12; overflow: hidden; cursor: crosshair; box-shadow: 0 0 30px rgba(243, 156, 18, 0.2); background-image: radial-gradient(circle at 50% 50%, #222 0%, #050505 100%); }

  /* Квадрат (Цель) */
  #target { position: absolute; background: #f1c40f; border-radius: 0; box-shadow: 0 0 20px rgba(241, 196, 15, 0.8); will-change: left, top, width, height; transition: width 0.2s, height 0.2s; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
  #target::after { content: '💵'; }
  #target:active { transform: scale(0.9); }

  /* Бомбы */
  .bomb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #555, #111 70%); box-shadow: 0 0 18px rgba(231, 76, 60, 0.8), inset -4px -4px 8px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; will-change: left, top; animation: bombPulse 0.8s ease-in-out infinite alternate; border: 2px solid #e74c3c; }
  @keyframes bombPulse { from { box-shadow: 0 0 12px rgba(231, 76, 60, 0.4); } to { box-shadow: 0 0 28px rgba(231, 76, 60, 0.95); } }

  /* Бонусы */
  .bonus { position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; z-index: 8; animation: bounce 0.5s ease-in-out infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .bonus.star { color: #f1c40f; text-shadow: 0 0 10px #f1c40f; }
  .bonus.time { color: #2ecc71; text-shadow: 0 0 10px #2ecc71; }

  .pop { position: absolute; font-weight: bold; color: #2ecc71; pointer-events: none; animation: popUp 0.7s ease-out forwards; font-size: 1.4rem; font-family: 'Pricedown', sans-serif; z-index: 9; text-shadow: 2px 2px 0 #000; }
  .pop.bad { color: #e74c3c; }
  .pop.gold { color: #f1c40f; }
  @keyframes popUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1.3); } }

  .flash { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,0.9), transparent 70%); animation: flashOut 0.4s ease-out forwards; z-index: 5; }
  @keyframes flashOut { 0% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.3); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.6); } }

  .explosion { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(231, 76, 60, 0.95), rgba(243, 156, 18, 0.5) 50%, transparent 75%); animation: explode 0.5s ease-out forwards; z-index: 7; }
  @keyframes explode { 0% { opacity: 1; transform: translate(-50%,-50%) scale(0.3); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(2.2); } }

  /* Оверлей / Меню */
  #overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; text-align: center; padding: 18px; z-index: 10; overflow-y: auto; }
  #overlay.hidden { display: none; }
  #overlay h2 { color: #f39c12; font-size: 2rem; font-family: 'Pricedown', sans-serif; text-shadow: 2px 2px 0 #000; }
  #overlay p { color: #ccc; line-height: 1.45; font-size: 1rem; font-weight: bold; }
  #overlay .big { font-size: 3rem; color: #f39c12; font-weight: bold; font-family: 'Pricedown', sans-serif; text-shadow: 3px 3px 0 #000; }
  
  button.action-btn { padding: 12px 32px; font-size: 1.2rem; font-weight: bold; background: #f39c12; color: #000; border: 2px solid #fff; border-radius: 0; cursor: pointer; transition: transform 0.1s, background 0.2s; font-family: 'Pricedown', sans-serif; text-transform: uppercase; box-shadow: 4px 4px 0 #000; }
  button.action-btn:hover { background: #e67e22; }
  button.action-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }

  .settings { width: 100%; max-width: 380px; background: #111; border: 2px solid #333; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; box-shadow: inset 0 0 10px #000; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .row label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #f39c12; font-weight: 700; }
  .volume-wrap { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { -webkit-appearance: none; flex: 1; height: 8px; background: #333; outline: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #f39c12; cursor: pointer; border: 2px solid #fff; }
  #volVal { font-size: 0.9rem; color: #fff; font-weight: bold; min-width: 42px; text-align: right; font-family: 'Pricedown', sans-serif; }
  #muteBtn { padding: 6px 10px; font-size: 1rem; background: #222; border: 2px solid #f39c12; color: #fff; cursor: pointer; min-width: 44px; }
  #muteBtn:hover { background: #f39c12; color: #000; }

  #levelGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 380px; }
  .lvl { aspect-ratio: 1; background: #111; color: #888; font-weight: bold; font-size: 1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #333; transition: transform 0.1s, background 0.2s; position: relative; font-family: 'Pricedown', sans-serif; }
  .lvl:hover:not(.locked) { background: #222; border-color: #f39c12; transform: scale(1.05); }
  .lvl.done { background: #27ae60; color: #fff; border-color: #2ecc71; }
  .lvl.current { background: #f39c12; color: #000; border-color: #fff; box-shadow: 0 0 15px rgba(243, 156, 18, 0.6); }
  .lvl.locked { background: #000; color: #333; cursor: not-allowed; }
  .lvl .bombMark { position: absolute; top: 2px; right: 3px; font-size: 0.6rem; }

  .legend { display: flex; gap: 14px; font-size: 0.8rem; color: #888; margin-top: 4px; flex-wrap: wrap; justify-content: center; font-weight: bold; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 12px; height: 12px; display: inline-block; border: 1px solid #555; }
  .btnRow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; width: 100%; }
  .btnRow button { flex: 1; min-width: 120px; }

  /* Модалка входа */
  #authModal { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; gap: 10px; padding: 20px; }
  #authModal.show { display: flex; }
  .auth-box { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; background: #111; padding: 20px; border: 2px solid #f39c12; box-shadow: 0 0 20px rgba(243, 156, 18, 0.2); }
  .auth-box h2 { font-family: 'Pricedown', sans-serif; color: #f39c12; font-size: 1.8rem; text-align: center; }
  .auth-box input { padding: 10px 14px; border: 2px solid #444; background: #000; color: #f39c12; font-size: 1.1rem; outline: none; font-family: 'Pricedown', sans-serif; }
  .auth-box input:focus { border-color: #f39c12; }
  .auth-box button { padding: 12px; font-size: 1.2rem; background: #f39c12; color: #000; border: none; cursor: pointer; font-weight: bold; font-family: 'Pricedown', sans-serif; }
  .auth-box button:hover { background: #e67e22; }
  .auth-error { color: #e74c3c; font-size: 0.9rem; min-height: 1.2em; text-align: center; font-weight: bold; }
  .close-auth { font-size: 0.9rem; color: #888; cursor: pointer; text-align: center; margin-top: 4px; text-decoration: underline; }
  .close-auth:hover { color: #fff; }

  /* Магазин */
  .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 380px; margin-top: 10px; }
  .shop-item { background: #111; border: 2px solid #333; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; position: relative; }
  .shop-item:hover { border-color: #f39c12; transform: translateY(-2px); }
  .shop-item.active { border-color: #f39c12; background: #222; box-shadow: inset 0 0 10px rgba(243, 156, 18, 0.2); }
  .shop-item.locked { opacity: 0.6; }
  .shop-item .bg-preview { width: 100%; height: 60px; border: 2px solid #333; }
  .shop-item .price { font-size: 1rem; font-weight: bold; color: #f1c40f; font-family: 'Pricedown', sans-serif; }
  .shop-item .name { font-size: 0.95rem; font-weight: bold; color: #fff; font-family: 'Pricedown', sans-serif; text-transform: uppercase; }

</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <h1 class="gta-font">GTA: Поймай Квадрат</h1>
  <div class="sub">Los Santos, San Andreas</div>

  <div id="topPanel"></div>

  <div id="hud" style="display:none;">
    <div class="stat"><div class="label">Уровень</div><div class="value" id="levelVal">1</div></div>
    <div class="stat"><div class="label">Очки</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">Цель/Время</div><div class="value" id="goal">0</div></div>
    <div class="stat"><div class="label">Время</div><div class="value" id="time">30</div></div>
    <div class="stat"><div class="label">Деньги</div><div class="value" id="coinHud">$0</div></div>
  </div>

  <div id="timebar-wrap" style="display:none;"><div id="timebar"></div></div>

  <div id="controlBar" style="visibility:hidden;">
    <div id="comboBadge">COMBO x1</div>
    <div id="controlsRight">
      <button id="pauseBtn">⏸ Пауза</button>
      <button id="settingsBtn">⚙ Меню</button>
    </div>
  </div>

  <div id="arena">
    <div id="target" style="display:none"></div>
    <div id="overlay"></div>

    <div id="authModal">
      <div class="auth-box">
        <h2>Угон аккаунта</h2>
        <input type="text" id="authUser" placeholder="Ник" maxlength="15" autocomplete="off">
        <input type="password" id="authPass" placeholder="Пароль" maxlength="20">
        <div class="auth-error" id="authError"></div>
        <button id="authSubmitBtn">Взломать</button>
        <div class="close-auth" id="closeAuthBtn">Отмена</div>
      </div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCZ-1lTVrL_5xYX7-_8EDBxC_1tsj-ayRA",
    authDomain: "yrik-0gameblock.firebaseapp.com",
    databaseURL: "https://yrik-0gameblock-default-rtdb.firebaseio.com", 
    projectId: "yrik-0gameblock",
    storageBucket: "yrik-0gameblock.firebasestorage.app",
    messagingSenderId: "155342712918",
    appId: "1:155342712918:web:de41d862996700068d0bf7"
  };

  let db = null;
  try {
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    }
  } catch (e) { console.error("Firebase не загрузился", e); }

  const arena    = document.getElementById('arena');
  const target   = document.getElementById('target');
  const overlay  = document.getElementById('overlay');
  const topPanel = document.getElementById('topPanel');
  const authModal = document.getElementById('authModal');
  const scoreEl  = document.getElementById('score');
  const timeEl   = document.getElementById('time');
  const goalEl   = document.getElementById('goal');
  const levelEl  = document.getElementById('levelVal');
  const coinHud  = document.getElementById('coinHud');
  const timebar  = document.getElementById('timebar');
  const pauseBtn = document.getElementById('pauseBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const comboBadge = document.getElementById('comboBadge');
  const hud = document.getElementById('hud');
  const timebarWrap = document.getElementById('timebar-wrap');
  const controlBar = document.getElementById('controlBar');

  const THEMES = {
    default: { name: 'Los Santos', price: 0, bg: '#111', arena: '#050505' },
    neon: { name: 'Vice City', price: 100, bg: '#0a001a', arena: '#1a0033' },
    space: { name: 'Area 69', price: 250, bg: '#050510', arena: '#101020' },
    forest: { name: 'Whetstone', price: 500, bg: '#0a1a0a', arena: '#1a2e1a' },
    lava: { name: 'San Fierro', price: 1000, bg: '#1a0000', arena: '#330000' }
  };

  let currentUser = null;
  let settings = { volume: 0.5, muted: false, theme: 'default' };
  let progress = { unlocked: 1, best: {}, coins: 0, ownedThemes: ['default'] };
  let isEndless = false;

  function updateCoinHud() { coinHud.textContent = '$' + progress.coins; }

  function updateTheme() {
    const t = THEMES[settings.theme] || THEMES.default;
    document.body.style.backgroundColor = t.bg;
    arena.style.backgroundImage = `radial-gradient(circle at 50% 50%, ${t.arena} 0%, #000 100%)`;
    
    if (settings.theme === 'neon') {
      arena.style.borderColor = '#e94560';
      arena.style.boxShadow = '0 0 30px #e94560';
    } else if (settings.theme === 'space') {
      arena.style.borderColor = '#4ecca3';
      arena.style.boxShadow = '0 0 30px #4ecca3';
    } else {
      arena.style.borderColor = '#f39c12';
      arena.style.boxShadow = '0 0 30px rgba(243, 156, 18, 0.2)';
    }
  }

  function updateTopPanel() {
    if (currentUser) {
      topPanel.innerHTML = `
        <div class="user-profile">
          <span>Игрок: <b>${currentUser}</b> | 💵 <b>$${progress.coins}</b></span>
          <button class="auth-btn" id="logoutBtn">Выйти</button>
        </div>
      `;
      document.getElementById('logoutBtn').onclick = () => {
        if (confirm('Свалить из Лос-Сантоса?')) {
          sfx.ui(); currentUser = null; localStorage.removeItem('catchCurrentUser');
          progress = { unlocked: 1, best: {}, coins: 0, ownedThemes: ['default'] };
          settings = { volume: 0.5, muted: false, theme: 'default' };
          updateTheme(); updateTopPanel(); updateCoinHud(); startMenu();
        }
      };
    } else {
      topPanel.innerHTML = `
        <button class="auth-btn" id="loginBtn">Вход</button>
        <button class="auth-btn primary" id="regBtn">Регистрация</button>
      `;
      document.getElementById('loginBtn').onclick = () => openAuthModal(true);
      document.getElementById('regBtn').onclick = () => openAuthModal(false);
    }
  }

  let isLoginMode = true;
  function openAuthModal(loginMode) {
    isLoginMode = loginMode;
    document.querySelector('.auth-box h2').textContent = isLoginMode ? 'Угон аккаунта' : 'Новый бандит';
    document.getElementById('authSubmitBtn').textContent = isLoginMode ? 'Войти' : 'Создать';
    document.getElementById('authUser').value = '';
    document.getElementById('authPass').value = '';
    document.getElementById('authError').textContent = '';
    authModal.classList.add('show');
  }

  document.getElementById('closeAuthBtn').onclick = () => authModal.classList.remove('show');
  
  document.getElementById('authSubmitBtn').onclick = () => {
    const u = document.getElementById('authUser').value.trim();
    const p = document.getElementById('authPass').value;
    const errEl = document.getElementById('authError');
    
    if (!u || !p) { errEl.textContent = 'Заполни все поля!'; return; }
    if (!db) { errEl.textContent = 'Ошибка: Нет доступа к Firebase. Проверь интернет!'; return; }

    errEl.textContent = 'Загрузка...';

    if (u === 'admin' && p === 'AF24h144') {
      db.ref('users/admin').once('value').then(snapshot => {
        let adminData = snapshot.val();
        if (!adminData) {
          adminData = { password: p, settings: { volume: 0.5, muted: false, theme: 'default' }, progress: { unlocked: 50, best: {}, coins: 9999, ownedThemes: Object.keys(THEMES) } };
          db.ref('users/admin').set(adminData);
        } else {
          adminData.progress.unlocked = 50;
          adminData.progress.coins = 9999;
          adminData.progress.ownedThemes = Object.keys(THEMES);
          db.ref('users/admin').set(adminData);
        }
        loginSuccess(u, adminData);
      }).catch(e => { errEl.textContent = 'Ошибка Firebase. Проверь правила (Rules)'; });
      return;
    }

    db.ref('users/' + u).once('value').then(snapshot => {
      const existingData = snapshot.val();

      if (isLoginMode) {
        if (!existingData) { errEl.textContent = 'Аккаунт не найден'; return; }
        if (existingData.password !== p) { errEl.textContent = 'Неверный пароль'; return; }
        loginSuccess(u, existingData);
      } else {
        if (existingData) { errEl.textContent = 'Этот ник уже занят'; return; }
        const newData = { password: p, settings: { volume: 0.5, muted: false, theme: 'default' }, progress: { unlocked: 1, best: {}, coins: 0, ownedThemes: ['default'] } };
        db.ref('users/' + u).set(newData).then(() => {
          loginSuccess(u, newData);
        }).catch(e => { errEl.textContent = 'Ошибка записи! Открой Firebase -> Rules и разреши чтение/запись.'; });
      }
    }).catch(e => {
      errEl.textContent = 'Ошибка базы данных (Проверь правила Firebase)';
    });
  };

  function loginSuccess(username, data) {
    currentUser = username;
    localStorage.setItem('catchCurrentUser', username);
    settings = { volume: 0.5, muted: false, theme: 'default', ...data.settings };
    progress = { unlocked: 1, best: {}, coins: 0, ownedThemes: ['default'], ...data.progress };
    if (!progress.ownedThemes) progress.ownedThemes = ['default'];
    
    updateTheme();
    updateCoinHud();
    authModal.classList.remove('show');
    updateTopPanel();
    startMenu();
    sfx.start();
  }

  function saveUserDataToDB() {
    if (!currentUser || !db) return;
    db.ref('users/' + currentUser).once('value').then(snap => {
      const existing = snap.val() || {};
      db.ref('users/' + currentUser).set({
        password: existing.password,
        settings: settings,
        progress: progress
      });
    });
  }

  function makeLevels() {
    const levels = [];
    for (let i = 1; i <= 50; i++) {
      const goal = Math.round(6 + (i - 1) * 2.2 + Math.pow(i, 1.25) * 0.4);
      const time = i <= 10 ? 30 : (i <= 25 ? 28 : (i <= 40 ? 26 : 24));
      const baseSize = Math.max(48, 70 - Math.floor(i * 0.4));
      const minSize  = Math.max(24, 44 - Math.floor(i * 0.3));
      let bombChance = 0;
      if (i >= 10) bombChance = Math.min(0.45, 0.12 + (i - 10) * 0.008);
      levels.push({ level: i, goal, time, baseSize, minSize, bombChance });
    }
    return levels;
  }
  const LEVELS = makeLevels();

  let currentLevel = 1;
  let score = 0;
  let timeLeft = 30;
  let combo = 0;
  let comboMult = 1;
  let timer = null;
  let running = false;
  let paused = false;
  let lastHit = 0;

  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
  function effectiveVolume() { return settings.muted ? 0 : settings.volume; }
  function playTone(freq, duration, type = 'sine', gainVal = 0.15, slideTo = null) {
    const vol = effectiveVolume();
    if (!audioCtx || vol <= 0) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(gainVal * vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  const sfx = {
    hit: (lvl) => { const base = 440 + Math.min(lvl, 10) * 60; playTone(base, 0.12, 'triangle', 0.18); playTone(base * 1.5, 0.08, 'sine', 0.1); },
    start: () => { playTone(330, 0.1, 'square', 0.1); setTimeout(()=>playTone(494, 0.15,'square',0.1),100); },
    win:   () => { playTone(523,0.12,'sine',0.15); setTimeout(()=>playTone(659,0.12,'sine',0.15),110); setTimeout(()=>playTone(784,0.2,'sine',0.15),220); },
    lose:  () => { playTone(330,0.2,'sawtooth',0.12, 200); setTimeout(()=>playTone(200,0.4,'sawtooth',0.12,120),200); },
    combo: () => { playTone(660, 0.1,'sine',0.15); setTimeout(()=>playTone(880,0.12,'sine',0.15),90); },
    pause: () => playTone(300, 0.1, 'square', 0.1),
    tick:  () => playTone(880, 0.05, 'sine', 0.06),
    bomb:  () => { playTone(120, 0.4, 'sawtooth', 0.3, 40); playTone(80, 0.5, 'square', 0.2, 30); },
    ui:    () => playTone(520, 0.06, 'sine', 0.1),
    buy:   () => { playTone(600, 0.1, 'sine', 0.1); setTimeout(()=>playTone(800, 0.1, 'sine', 0.1), 100); setTimeout(()=>playTone(1000, 0.2, 'sine', 0.1), 200); },
    star:  () => { playTone(880, 0.1, 'sine', 0.2); setTimeout(()=>playTone(1320, 0.15, 'sine', 0.2), 80); },
    time:  () => { playTone(440, 0.1, 'triangle', 0.2); setTimeout(()=>playTone(660, 0.15, 'triangle', 0.2), 80); }
  };

  function spawnEffect(x, y, text, type = 'good') {
    const pop = document.createElement('div');
    pop.className = 'pop ' + (type === 'bad' ? 'bad' : type === 'gold' ? 'gold' : '');
    pop.textContent = text; pop.style.left = x + 'px'; pop.style.top = y + 'px';
    arena.appendChild(pop); setTimeout(() => pop.remove(), 700);
    if (type === 'good' || type === 'gold') {
      const flash = document.createElement('div');
      flash.className = 'flash'; flash.style.left = x + 'px'; flash.style.top = y + 'px';
      flash.style.width = '80px'; flash.style.height = '80px';
      arena.appendChild(flash); setTimeout(() => flash.remove(), 400);
    }
  }
  function spawnExplosion(x, y) {
    const ex = document.createElement('div');
    ex.className = 'explosion'; ex.style.left = x + 'px'; ex.style.top = y + 'px';
    ex.style.width = '90px'; ex.style.height = '90px';
    arena.appendChild(ex); setTimeout(() => ex.remove(), 500);
  }

  let bombEl = null; let bombTimeout = null;
  let bonusEl = null; let bonusTimeout = null;

  function clearBomb() { if (bombEl) { bombEl.remove(); bombEl = null; } if (bombTimeout) { clearTimeout(bombTimeout); bombTimeout = null; } }
  function clearBonus() { if (bonusEl) { bonusEl.remove(); bonusEl = null; } if (bonusTimeout) { clearTimeout(bonusTimeout); bonusTimeout = null; } }
  
  function levelCfg() {
    if (isEndless) {
      return { baseSize: 60, minSize: 20, bombChance: 0.3, time: 1, bonusChance: 0.15 };
    }
    return LEVELS[currentLevel - 1];
  }

  function maybeSpawnBonus() {
    const c = levelCfg();
    if (!running || paused || c.bombChance <= 0) return;
    clearBonus();
    if (Math.random() > 0.2) { 
      bonusTimeout = setTimeout(maybeSpawnBonus, 1500 + Math.random() * 1500); return;
    }
    
    const isStar = Math.random() > 0.5;
    bonusEl = document.createElement('div');
    bonusEl.className = 'bonus ' + (isStar ? 'star' : 'time');
    bonusEl.textContent = isStar ? '⭐' : '⏳';
    bonusEl.dataset.type = isStar ? 'star' : 'time';
    
    const maxX = arena.clientWidth - 40; const maxY = arena.clientHeight - 40;
    bonusEl.style.left = Math.random() * maxX + 'px'; bonusEl.style.top = Math.random() * maxY + 'px';
    
    bonusEl.addEventListener('mousedown', onBonusHit); bonusEl.addEventListener('touchstart', onBonusHit, { passive: false });
    arena.appendChild(bonusEl);
    
    bonusTimeout = setTimeout(() => {
      clearBonus(); if (running && !paused) maybeSpawnBonus();
    }, 3000 + Math.random() * 2000);
  }

  function onBonusHit(e) {
    if (!running || paused) return;
    e.preventDefault(); e.stopPropagation();
    const rect = arena.getBoundingClientRect();
    const x = e.clientX - rect.left; const y = e.clientY - rect.top;
    const type = bonusEl.dataset.type;
    
    clearBonus();
    
    if (type === 'star') {
      spawnEffect(x, y, '★ +10', 'gold');
      sfx.star();
      score += 10;
      scoreEl.textContent = score;
      if (currentUser) { progress.coins += 1; updateCoinHud(); saveUserDataToDB(); }
    } else if (type === 'time') {
      spawnEffect(x, y, '⏳ +3с', 'good');
      sfx.time();
      if (isEndless) { score += 5; scoreEl.textContent = score; }
      else { timeLeft += 3; timeEl.textContent = timeLeft; }
    }
    
    if (running && !paused) bonusTimeout = setTimeout(maybeSpawnBonus, 3000);
  }

  function maybeSpawnBomb() {
    const c = levelCfg();
    if (!running || paused || c.bombChance <= 0) return;
    clearBomb();
    if (Math.random() > c.bombChance) { bombTimeout = setTimeout(maybeSpawnBomb, 900 + Math.random() * 900); return; }
    const size = 46;
    bombEl = document.createElement('div'); bombEl.className = 'bomb'; bombEl.textContent = '💣';
    bombEl.style.width = size + 'px'; bombEl.style.height = size + 'px';
    const maxX = arena.clientWidth - size; const maxY = arena.clientHeight - size;
    bombEl.style.left = Math.random() * maxX + 'px'; bombEl.style.top  = Math.random() * maxY + 'px';
    bombEl.addEventListener('mousedown', onBombHit); bombEl.addEventListener('touchstart', onBombHit, { passive: false });
    arena.appendChild(bombEl);
    bombTimeout = setTimeout(() => { clearBomb(); if (running && !paused) maybeSpawnBomb(); }, 2500 + Math.random() * 1500);
  }

  function onBombHit(e) {
    if (!running || paused) return;
    e.preventDefault(); e.stopPropagation();
    const rect = arena.getBoundingClientRect();
    spawnExplosion(e.clientX - rect.left, e.clientY - rect.top); spawnEffect(e.clientX - rect.left, e.clientY - rect.top, '💥 -5', 'bad'); sfx.bomb();
    score = Math.max(0, score - 5); scoreEl.textContent = score;
    combo = 0; comboMult = 1; comboBadge.classList.remove('show');
    clearBomb(); if (running && !paused) bombTimeout = setTimeout(maybeSpawnBomb, 800);
  }

  function moveTarget() {
    const c = levelCfg();
    let size = c.baseSize;
    if (isEndless) {
       size = Math.max(25, 60 - Math.floor(score / 10));
    } else {
       const progressRatio = 1 - (timeLeft / c.time);
       size = Math.max(c.minSize, c.baseSize - progressRatio * (c.baseSize - c.minSize));
    }
    
    target.style.width = size + 'px'; target.style.height = size + 'px';
    const maxX = arena.clientWidth - size; const maxY = arena.clientHeight - size;
    target.style.left = Math.random() * maxX + 'px'; target.style.top  = Math.random() * maxY + 'px';
    if (c.bombChance > 0) maybeSpawnBomb();
    if (c.bombChance > 0 && Math.random() > 0.5) maybeSpawnBonus();
  }

  function startLevel(n) {
    isEndless = false;
    currentLevel = n; const c = LEVELS[n - 1];
    initAudio(); sfx.start();
    score = 0; timeLeft = c.time; combo = 0; comboMult = 1;
    running = true; paused = false;
    
    hud.style.display = 'flex';
    timebarWrap.style.display = 'block';
    controlBar.style.visibility = 'visible';
    levelEl.textContent = n;
    goalEl.textContent = c.goal;
    updateCoinHud();
    
    overlay.classList.add('hidden');
    scoreEl.textContent = 0;
    timeEl.textContent = c.time; timebar.style.width = '100%';
    comboBadge.classList.remove('show');
    target.style.display = 'block';
    pauseBtn.textContent = '⏸ Пауза';
    moveTarget(); clearBomb(); clearBonus();
    if (c.bombChance > 0) bombTimeout = setTimeout(maybeSpawnBomb, 1200);
    bonusTimeout = setTimeout(maybeSpawnBonus, 2000);
    clearInterval(timer);
    timer = setInterval(() => {
      if (paused) return;
      timeLeft--; timeEl.textContent = timeLeft;
      timebar.style.width = (timeLeft / c.time * 100) + '%';
      if (timeLeft <= 5 && timeLeft > 0) sfx.tick();
      if (timeLeft <= 0) endLevel();
    }, 1000);
  }

  function startEndless() {
    isEndless = true;
    initAudio(); sfx.start();
    score = 0; timeLeft = 0; combo = 0; comboMult = 1;
    running = true; paused = false;
    
    hud.style.display = 'flex';
    timebarWrap.style.display = 'none'; 
    controlBar.style.visibility = 'visible';
    levelEl.textContent = '∞';
    goalEl.textContent = 'Рекорд';
    updateCoinHud();
    
    overlay.classList.add('hidden');
    scoreEl.textContent = 0;
    timeEl.textContent = '∞'; 
    comboBadge.classList.remove('show');
    target.style.display = 'block';
    pauseBtn.textContent = '⏸ Пауза';
    moveTarget(); clearBomb(); clearBonus();
    
    maybeSpawnBomb();
    maybeSpawnBonus();
    
    clearInterval(timer);
    timer = setInterval(() => {
      if (paused) return;
      timeLeft++; timeEl.textContent = timeLeft;
      if (timeLeft % 10 === 0) maybeSpawnBomb();
      if (timeLeft % 15 === 0) maybeSpawnBonus();
    }, 1000);
  }

  function endLevel() {
    clearInterval(timer); clearBomb(); clearBonus(); running = false; target.style.display = 'none';
    
    let passed = false;
    let coinsEarned = 0;

    if (isEndless) {
      const prevBest = progress.best['endless'] || 0;
      if (score > prevBest) {
        progress.best['endless'] = score;
        coinsEarned = Math.floor(score / 5);
        progress.coins += coinsEarned;
        saveUserDataToDB();
      }
      sfx.lose();
      overlay.innerHTML = `
        <h2>WASTED</h2>
        <p>Бесконечный режим</p>
        <div class="big">${score}</div>
        <p>Рекорд: <b>${progress.best['endless'] || 0}</b></p>
        ${coinsEarned > 0 ? `<p style="color:#27ae60">Заработано: $${coinsEarned}</p>` : ''}
        <div class="btnRow">
          <button class="action-btn" id="againBtn">Ещё раз</button>
          <button class="action-btn" id="menuBtn" style="background:#222; color:#f39c12;">В меню</button>
        </div>
      `;
      overlay.classList.remove('hidden');
      document.getElementById('againBtn').onclick = startEndless;
      document.getElementById('menuBtn').onclick = startMenu;
      updateTopPanel();
      updateCoinHud();
      return;
    }

    const c = LEVELS[currentLevel - 1]; 
    passed = score >= c.goal;
    coinsEarned = Math.floor(score / 2);

    if (currentUser) {
      if (score > (progress.best[currentLevel] || 0)) progress.best[currentLevel] = score;
      if (passed && progress.unlocked <= currentLevel && currentLevel < 50) progress.unlocked = currentLevel + 1;
      if (passed && currentLevel === 50) progress.unlocked = 50;
      progress.coins += coinsEarned;
      saveUserDataToDB(); 
      updateTopPanel();
      updateCoinHud();
    }

    if (passed) {
      sfx.win(); const isLast = currentLevel === 50;
      overlay.innerHTML = `
        <h2>MISSION PASSED</h2>
        <p>Уровень ${currentLevel} · Очки</p>
        <div class="big">${score} / ${c.goal}</div>
        <p style="color:#f1c40f;">Заработано: $${coinsEarned}</p>
        ${currentUser ? `<p>Рекорд: <b>${progress.best[currentLevel]}</b></p>` : ''}
        <div class="btnRow">
          ${!isLast ? `<button class="action-btn" id="nextBtn">Дальше</button>` : ''}
          <button class="action-btn" id="againBtn" style="background:#222; color:#f39c12;">Ещё раз</button>
          <button class="action-btn" id="menuBtn" style="background:#222; color:#f39c12;">В меню</button>
        </div>
      `;
      overlay.classList.remove('hidden');
      if (!isLast) document.getElementById('nextBtn').onclick = () => startLevel(currentLevel + 1);
      document.getElementById('againBtn').onclick = () => startLevel(currentLevel);
      document.getElementById('menuBtn').onclick = startMenu;
    } else {
      sfx.lose();
      overlay.innerHTML = `
        <h2 style="color:#e74c3c;">MISSION FAILED</h2>
        <p>Уровень ${currentLevel} · Цель: ${c.goal}</p>
        <div class="big" style="color:#888;">${score} / ${c.goal}</div>
        <p>Не хватило <b style="color:#e74c3c;">${c.goal - score}</b> очков</p>
        <div class="btnRow">
          <button class="action-btn" id="retryBtn">Ещё раз</button>
          <button class="action-btn" id="menuBtn" style="background:#222; color:#f39c12;">В меню</button>
        </div>
      `;
      overlay.classList.remove('hidden');
      document.getElementById('retryBtn').onclick = () => startLevel(currentLevel);
      document.getElementById('menuBtn').onclick = startMenu;
    }
  }

  function hit(e) {
    if (!running || paused) return;
    e.preventDefault();
    const now = Date.now(); const delta = now - lastHit; lastHit = now;
    if (delta < 700) combo++; else combo = 0;
    if (combo > 0 && combo % 3 === 0) {
      comboMult = Math.min(1 + Math.floor(combo / 3) * 0.5, 4); sfx.combo();
      comboBadge.textContent = `COMBO x${comboMult.toFixed(1)}`;
      comboBadge.classList.add('show');
    }
    const points = Math.round(1 * comboMult);
    score += points; scoreEl.textContent = score;
    const rect = arena.getBoundingClientRect();
    spawnEffect(e.clientX - rect.left, e.clientY - rect.top, '+$' + points, 'good');
    sfx.hit(combo); moveTarget();
  }

  target.addEventListener('mousedown', hit);
  target.addEventListener('touchstart', hit, { passive: false });

  pauseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ Продолжить' : '⏸ Пауза';
    sfx.pause();
    if (paused) { overlay.innerHTML = `<h2>⏸ Пауза</h2><p>Отдохни немного 😌</p>`; overlay.classList.remove('hidden'); }
    else { overlay.classList.add('hidden'); }
  });

  function startMenu() {
    running = false; clearInterval(timer); clearBomb(); clearBonus(); target.style.display = 'none';
    hud.style.display = 'none';
    timebarWrap.style.display = 'none';
    controlBar.style.visibility = 'hidden';
    
    overlay.innerHTML = `
      <h2 style="margin-top:10px; font-size:2.2rem;">GTA: Поймай Квадрат</h2>
      <p>Los Santos, San Andreas</p>
      
      <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:10px;">
        <span style="font-size:1.4rem; color:#f1c40f;">💵 Бабки: <b>$${progress.coins}</b></span>
      </div>

      <div class="settings">
        <div class="row">
          <label>Громкость</label>
          <div class="volume-wrap">
            <input type="range" id="volSlider" min="0" max="1" step="0.05" value="${settings.volume}">
            <span id="volVal">${Math.round(settings.volume*100)}%</span>
            <button id="muteBtn" title="Mute">${settings.muted ? '🔇' : '🔊'}</button>
          </div>
        </div>
      </div>

      <div class="btnRow" style="flex-direction:column; gap:10px; margin-top:15px; width:100%; max-width:380px;">
        <button class="action-btn" id="playBtn" style="font-size:1.4rem;">▶ Миссия ${progress.unlocked}</button>
        <button class="action-btn" id="endlessBtn" style="background:#27ae60; color:#fff;">♾ Режим Выживания</button>
        <button class="action-btn" id="shopBtn" style="background:#222; color:#f39c12;">🛒 Ammu-Nation</button>
        <button class="action-btn" id="levelsBtn" style="background:#222; color:#f39c12; font-size:1rem;">☰ Карта</button>
      </div>
      ${!currentUser ? `<p style="color:#e74c3c; font-size:0.9rem; margin-top:10px;">Войди в аккаунт, чтобы зарабатывать бабки!</p>` : ''}
    `;
    overlay.classList.remove('hidden');

    document.getElementById('playBtn').onclick = () => startLevel(progress.unlocked);
    document.getElementById('endlessBtn').onclick = startEndless;
    document.getElementById('shopBtn').onclick = openShop;
    document.getElementById('levelsBtn').onclick = openLevels;

    const volSlider = document.getElementById('volSlider');
    const volVal = document.getElementById('volVal');
    volSlider.oninput = () => {
      settings.volume = Number(volSlider.value);
      volVal.textContent = Math.round(settings.volume*100) + '%';
      if (currentUser) saveUserDataToDB();
      if (!settings.muted) { initAudio(); playTone(600, 0.06, 'sine', 0.1); }
    };
    volSlider.onchange = () => sfx.ui();
    
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.onclick = () => {
      settings.muted = !settings.muted;
      if (currentUser) saveUserDataToDB();
      muteBtn.textContent = settings.muted ? '🔇' : '🔊';
      initAudio(); if (!settings.muted) sfx.ui();
    };
  }

  function openShop() {
    overlay.innerHTML = `
      <h2 style="color:#f39c12; margin-top:10px;">Ammu-Nation</h2>
      <p>У тебя <b style="color:#27ae60;">$${progress.coins}</b> бабок.</p>
      
      <div class="shop-grid">
        ${Object.entries(THEMES).map(([key, t]) => {
          const isOwned = progress.ownedThemes.includes(key);
          const isActive = settings.theme === key;
          return `
            <div class="shop-item ${isActive ? 'active' : ''} ${!isOwned ? 'locked' : ''}" data-theme="${key}">
              <div class="bg-preview" style="background:${t.arena};"></div>
              <div class="name">${t.name}</div>
              ${isOwned 
                ? `<div class="price" style="color:#27ae60;">${isActive ? 'Выбран' : 'Выбрать'}</div>`
                : `<div class="price">$${t.price}</div>`
              }
            </div>
          `;
        }).join('')}
      </div>
      
      <button class="action-btn" id="backToMenuBtn" style="margin-top:15px; background:#222; color:#f39c12;">← Назад</button>
    `;

    document.getElementById('backToMenuBtn').onclick = startMenu;

    document.querySelectorAll('.shop-item').forEach(item => {
      item.onclick = () => {
        const themeKey = item.dataset.theme;
        const t = THEMES[themeKey];
        const isOwned = progress.ownedThemes.includes(themeKey);

        if (isOwned) {
          settings.theme = themeKey;
          updateTheme();
          saveUserDataToDB();
          sfx.ui();
          openShop();
        } else {
          if (progress.coins >= t.price) {
            progress.coins -= t.price;
            progress.ownedThemes.push(themeKey);
            settings.theme = themeKey;
            updateTheme();
            saveUserDataToDB();
            updateTopPanel();
            updateCoinHud();
            sfx.buy();
            openShop();
          } else {
            sfx.lose();
            alert("Не хватает бабок!");
          }
        }
      };
    });
  }

  function openLevels() {
    const cells = LEVELS.map(l => {
      const unlocked = l.level <= progress.unlocked;
      const done = (progress.best[l.level] || 0) >= l.goal;
      const isCurrent = l.level === progress.unlocked;
      let cls = 'lvl';
      if (!unlocked) cls += ' locked'; else if (done) cls += ' done'; else if (isCurrent) cls += ' current';
      const bombMark = l.bombChance > 0 ? '<span class="bombMark">💣</span>' : '';
      return `<div class="${cls}" data-level="${l.level}">${l.level}${bombMark}</div>`;
    }).join('');

    overlay.innerHTML = `
      <h2 style="margin-top:10px;">Карта Лос-Сантоса</h2>
      <div id="levelGrid">${cells}</div>
      <div class="legend">
        <span><span class="dot" style="background:#27ae60;border:1px solid #2ecc71"></span>Пройдено</span>
        <span><span class="dot" style="background:#f39c12"></span>Текущая</span>
        <span><span class="dot" style="background:#000;border:1px solid #333"></span>Закрыто</span>
      </div>
      <button class="action-btn" id="backToMenuBtn" style="margin-top:15px; background:#222; color:#f39c12;">← Назад</button>
    `;

    document.getElementById('backToMenuBtn').onclick = startMenu;

    overlay.querySelectorAll('.lvl').forEach(cell => {
      cell.onclick = () => {
        const lvl = Number(cell.dataset.level);
        if (lvl > progress.unlocked) { cell.style.borderColor = '#e74c3c'; setTimeout(() => cell.style.borderColor = 'transparent', 200); playTone(200, 0.1, 'sawtooth', 0.1); return; }
        sfx.ui(); startLevel(lvl);
      };
    });
  }

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!running) return;
    paused = true;
    startMenu();
  });

  updateTheme();
  updateTopPanel();
  updateCoinHud();
  startMenu(); 

  const savedUser = localStorage.getItem('catchCurrentUser');
  if (savedUser && db) {
    db.ref('users/' + savedUser).once('value').then(snap => {
      if (snap.exists()) {
        loginSuccess(savedUser, snap.val());
      }
    }).catch(console.error);
  }
</script>
</body>
</html>
