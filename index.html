<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поймай квадрат — 50 уровней (Online)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1f2a4a, #0d0d1a 70%);
    color: #eee;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; user-select: none;
  }
  h1 { font-size: 1.5rem; margin-bottom: 6px; color: #e94560; letter-spacing: 1px; text-align: center; }
  .sub { font-size: 0.85rem; color: #7a8ba8; margin-bottom: 14px; text-align: center; }

  #topPanel { width: 90vw; max-width: 500px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 10px; min-height: 30px; }
  .auth-btn { background: #0f3460; color: #eee; border: 1px solid #1a4a7a; padding: 6px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; font-weight: bold; transition: background 0.2s; }
  .auth-btn:hover { background: #1a4a7a; }
  .auth-btn.primary { background: #e94560; border-color: #ff6b6b; }
  .auth-btn.primary:hover { background: #ff6b6b; }
  .user-profile { font-size: 0.85rem; color: #7a8ba8; display: flex; align-items: center; gap: 10px; }
  .user-profile b { color: #4ecca3; font-size: 1rem; }

  #hud { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  .stat { background: #16213e; border: 1px solid #0f3460; border-radius: 10px; padding: 8px 16px; text-align: center; min-width: 80px; }
  .stat .label { font-size: 0.7rem; color: #7a8ba8; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 1.3rem; font-weight: bold; color: #4ecca3; }

  #timebar-wrap { width: 90vw; max-width: 500px; height: 10px; background: #16213e; border-radius: 6px; overflow: hidden; margin-bottom: 10px; border: 1px solid #0f3460; }
  #timebar { height: 100%; width: 100%; background: linear-gradient(90deg, #4ecca3, #e94560); transition: width 0.1s linear; border-radius: 6px; }

  #controlBar { width: 90vw; max-width: 500px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; min-height: 40px; }
  #comboBadge { background: rgba(233,69,96,0.9); color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; opacity: 0; transform: translateY(-4px); transition: all 0.2s; box-shadow: 0 0 16px rgba(233,69,96,0.5); }
  #comboBadge.show { opacity: 1; transform: translateY(0); }
  #controlsRight { display: flex; gap: 8px; margin-left: auto; }
  #controlsRight button { padding: 8px 14px; font-size: 0.85rem; background: #0f3460; color: #eee; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
  #controlsRight button:hover { background: #1a4a7a; }

  #arena { position: relative; width: 90vw; max-width: 500px; height: 500px; max-height: 55vh; background: #16213e; border: 2px solid #0f3460; border-radius: 12px; overflow: hidden; cursor: crosshair; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

  #target { position: absolute; background: linear-gradient(135deg, #e94560, #ff6b6b); border-radius: 10px; box-shadow: 0 0 20px rgba(233,69,96,0.7); will-change: left, top, width, height; transition: width 0.2s, height 0.2s; }
  #target:active { transform: scale(0.92); }
  
  .bomb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #555, #111 70%); box-shadow: 0 0 18px rgba(255,80,80,0.6), inset -4px -4px 8px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; will-change: left, top; animation: bombPulse 0.8s ease-in-out infinite alternate; }
  @keyframes bombPulse { from { box-shadow: 0 0 12px rgba(255,80,80,0.4), inset -4px -4px 8px rgba(0,0,0,0.8); } to { box-shadow: 0 0 28px rgba(255,80,80,0.95), inset -4px -4px 8px rgba(0,0,0,0.8); } }

  .pop { position: absolute; font-weight: bold; color: #4ecca3; pointer-events: none; animation: popUp 0.7s ease-out forwards; font-size: 1.2rem; text-shadow: 0 0 8px rgba(78,204,163,0.8); z-index: 6; }
  .pop.bad { color: #ff4d4d; text-shadow: 0 0 8px rgba(255,77,77,0.9); }
  @keyframes popUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1.3); } }

  .flash { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,0.9), transparent 70%); animation: flashOut 0.4s ease-out forwards; z-index: 5; }
  @keyframes flashOut { 0% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.3); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.6); } }

  .explosion { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,200,0,0.95), rgba(255,60,0,0.5) 50%, transparent 75%); animation: explode 0.5s ease-out forwards; z-index: 7; }
  @keyframes explode { 0% { opacity: 1; transform: translate(-50%,-50%) scale(0.3); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(2.2); } }

  #overlay { position: absolute; inset: 0; background: rgba(13, 13, 26, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; text-align: center; padding: 18px; z-index: 10; overflow-y: auto; border-radius: 10px; }
  #overlay.hidden { display: none; }
  #overlay h2 { color: #4ecca3; font-size: 1.4rem; }
  #overlay p { color: #b0b8c8; line-height: 1.45; font-size: 0.9rem; }
  #overlay .big { font-size: 2.2rem; color: #e94560; font-weight: bold; }
  button.action-btn { padding: 12px 32px; font-size: 1.05rem; font-weight: bold; background: #e94560; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.1s, background 0.2s; }
  button.action-btn:hover { background: #ff6b6b; }
  button.action-btn:active { transform: scale(0.96); }

  .settings { width: 100%; max-width: 380px; background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .row label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.7px; color: #7a8ba8; font-weight: 600; }
  .volume-wrap { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { -webkit-appearance: none; flex: 1; height: 6px; background: #0f3460; border-radius: 4px; outline: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #e94560; box-shadow: 0 0 8px rgba(233,69,96,0.8); cursor: pointer; }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #e94560; border: none; cursor: pointer; }
  #volVal { font-size: 0.85rem; color: #4ecca3; font-weight: bold; min-width: 42px; text-align: right; }
  #muteBtn { padding: 6px 10px; font-size: 1rem; background: #0f3460; border-radius: 8px; min-width: 44px; color: #fff; cursor: pointer; border: none; }
  #muteBtn:hover { background: #1a4a7a; }

  #levelGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 380px; }
  .lvl { aspect-ratio: 1; border-radius: 8px; background: #0f3460; color: #b0b8c8; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s, background 0.2s, border-color 0.2s; position: relative; }
  .lvl:hover:not(.locked) { background: #1a4a7a; transform: scale(1.05); }
  .lvl.done { background: #1a5a3a; color: #4ecca3; border-color: #4ecca3; }
  .lvl.current { background: #e94560; color: #fff; box-shadow: 0 0 12px rgba(233,69,96,0.7); animation: pulse 1.5s infinite; }
  .lvl.locked { background: #0a1225; color: #3a4560; cursor: not-allowed; }
  .lvl .bombMark { position: absolute; top: 2px; right: 3px; font-size: 0.55rem; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 12px rgba(233,69,96,0.7); } 50% { box-shadow: 0 0 22px rgba(233,69,96,1); } }

  .legend { display: flex; gap: 14px; font-size: 0.72rem; color: #7a8ba8; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .btnRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

  #authModal { position: absolute; inset: 0; background: rgba(13, 13, 26, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; border-radius: 10px; gap: 10px; padding: 20px; }
  #authModal.show { display: flex; }
  .auth-box { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; background: #16213e; padding: 20px; border-radius: 12px; border: 1px solid #0f3460; }
  .auth-box input { padding: 10px 14px; border-radius: 8px; border: 1px solid #0f3460; background: #0a1225; color: #eee; font-size: 1rem; outline: none; }
  .auth-box input:focus { border-color: #e94560; }
  .auth-box button { padding: 10px; font-size: 1rem; background: #e94560; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .auth-box button:hover { background: #ff6b6b; }
  .auth-error { color: #ff4d4d; font-size: 0.8rem; min-height: 1.2em; text-align: center; margin-top: -4px; }
  .close-auth { font-size: 0.8rem; color: #7a8ba8; cursor: pointer; text-decoration: underline; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
  <h1>🎯 Поймай квадрат — 50 уровней</h1>
  <div class="sub">Проходи уровни. С 10-го уровня появляются 💣 бомбы!</div>

  <div id="topPanel"></div>

  <div id="hud">
    <div class="stat"><div class="label">Уровень</div><div class="value" id="levelVal">1</div></div>
    <div class="stat"><div class="label">Очки</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">Цель</div><div class="value" id="goal">0</div></div>
    <div class="stat"><div class="label">Время</div><div class="value" id="time">30</div></div>
  </div>

  <div id="timebar-wrap"><div id="timebar"></div></div>

  <div id="controlBar">
    <div id="comboBadge">🔥 COMBO x1</div>
    <div id="controlsRight">
      <button id="pauseBtn">⏸ Пауза</button>
      <button id="settingsBtn">⚙ Меню</button>
    </div>
  </div>

  <div id="arena">
    <div id="target" style="display:none"></div>
    <div id="overlay"></div>

    <div id="authModal">
      <h2 id="authTitle" style="color:#4ecca3">Вход</h2>
      <div class="auth-box">
        <input type="text" id="authUser" placeholder="Логин" maxlength="15" autocomplete="off">
        <input type="password" id="authPass" placeholder="Пароль" maxlength="20">
        <div class="auth-error" id="authError"></div>
        <button id="authSubmitBtn">Войти</button>
        <div class="close-auth" id="closeAuthBtn">Закрыть</div>
      </div>
    </div>
  </div>

<script>
  // ============================================================
  // ВСТАВЬ СЮДА СВОЙ ТОКЕН И НИК С ГИТХАБА
  // ============================================================
  const GITHUB_TOKEN = MY_SECRET_TOKEN; // Токен, который ты скопировал
  const GITHUB_USER = "yarokstand-create";   // Твой ник на гитхабе
  const GITHUB_REPO = "game";                // Название репозитория
  const GITHUB_FILE = "database.json";       // Файл, который мы создали
  // ============================================================

  const arena    = document.getElementById('arena');
  const target   = document.getElementById('target');
  const overlay  = document.getElementById('overlay');
  const topPanel = document.getElementById('topPanel');
  const authModal = document.getElementById('authModal');
  const scoreEl  = document.getElementById('score');
  const timeEl   = document.getElementById('time');
  const goalEl   = document.getElementById('goal');
  const levelEl  = document.getElementById('levelVal');
  const timebar  = document.getElementById('timebar');
  const pauseBtn = document.getElementById('pauseBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const comboBadge = document.getElementById('comboBadge');

  let currentUser = null;
  let settings = { volume: 0.5, muted: false };
  let progress = { unlocked: 1, best: {} };
  
  let globalDB = {}; 

  // ЧТЕНИЕ ИЗ ГИТХАБА
  async function fetchDB() {
    try {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
      });
      if (!res.ok) throw new Error('Не удалось загрузить');
      const fileData = await res.json();
      const content = decodeURIComponent(escape(atob(fileData.content)));
      globalDB = JSON.parse(content) || {};
    } catch (e) {
      console.error("Ошибка загрузки:", e);
      alert("Ошибка загрузки. Проверь токен и файл database.json");
    }
  }

  // ЗАПИСЬ В ГИТХАБ
  async function pushDB() {
    try {
      // Сначала узнаем текущий SHA файла (нужно для обновления)
      const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
      });
      const fileData = await res.json();
      
      // Отправляем новый контент
      const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${GITHUB_TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'update database',
          content: btoa(unescape(encodeURIComponent(JSON.stringify(globalDB)))),
          sha: fileData.sha
        })
      });
      if (!updateRes.ok) throw new Error('Ошибка записи');
    } catch (e) {
      console.error("Ошибка сохранения:", e);
    }
  }

  function updateTopPanel() {
    if (currentUser) {
      topPanel.innerHTML = `
        <div class="user-profile">
          <span>Игрок: <b>${currentUser}</b></span>
          <button class="auth-btn" id="logoutBtn">Выйти</button>
        </div>
      `;
      document.getElementById('logoutBtn').onclick = () => {
        if (confirm('Выйти из аккаунта?')) {
          sfx.ui();
          currentUser = null;
          localStorage.removeItem('catchCurrentUser');
          progress = { unlocked: 1, best: {} };
          settings = { volume: 0.5, muted: false };
          updateTopPanel();
          startMenu();
        }
      };
    } else {
      topPanel.innerHTML = `
        <button class="auth-btn" id="loginBtn">Вход</button>
        <button class="auth-btn primary" id="regBtn">Регистрация</button>
      `;
      document.getElementById('loginBtn').onclick = () => openAuthModal(true);
      document.getElementById('regBtn').onclick = () => openAuthModal(false);
    }
  }

  let isLoginMode = true;
  function openAuthModal(loginMode) {
    isLoginMode = loginMode;
    document.getElementById('authTitle').textContent = isLoginMode ? 'Вход' : 'Регистрация';
    document.getElementById('authSubmitBtn').textContent = isLoginMode ? 'Войти' : 'Создать';
    document.getElementById('authUser').value = '';
    document.getElementById('authPass').value = '';
    document.getElementById('authError').textContent = '';
    authModal.classList.add('show');
  }

  document.getElementById('closeAuthBtn').onclick = () => authModal.classList.remove('show');
  
  document.getElementById('authSubmitBtn').onclick = async () => {
    const u = document.getElementById('authUser').value.trim();
    const p = document.getElementById('authPass').value;
    const errEl = document.getElementById('authError');
    
    if (!u || !p) { errEl.textContent = 'Заполни все поля!'; return; }
    
    errEl.textContent = 'Загрузка...';
    await fetchDB(); 

    if (u === 'admin' && p === 'AF24h144') {
      let adminData = globalDB['admin'] || { password: p, settings: { volume: 0.5, muted: false }, progress: { unlocked: 50, best: {} } };
      adminData.progress.unlocked = 50;
      globalDB['admin'] = adminData;
      await pushDB();
      loginSuccess(u, adminData);
      return;
    }

    const existingData = globalDB[u];

    if (isLoginMode) {
      if (!existingData) { errEl.textContent = 'Аккаунт не найден'; return; }
      if (existingData.password !== p) { errEl.textContent = 'Неверный пароль'; return; }
      loginSuccess(u, existingData);
    } else {
      if (existingData) { errEl.textContent = 'Этот ник уже занят'; return; }
      const newData = { password: p, settings: { volume: 0.5, muted: false }, progress: { unlocked: 1, best: {} } };
      globalDB[u] = newData;
      await pushDB();
      loginSuccess(u, newData);
    }
  };

  function loginSuccess(username, data) {
    currentUser = username;
    localStorage.setItem('catchCurrentUser', username);
    settings = data.settings || { volume: 0.5, muted: false };
    progress = data.progress || { unlocked: 1, best: {} };
    authModal.classList.remove('show');
    updateTopPanel();
    startMenu();
    sfx.start();
  }

  async function saveUserDataToDB() {
    if (!currentUser) return;
    globalDB[currentUser] = { password: globalDB[currentUser]?.password || '123', settings, progress };
    await pushDB();
  }

  function makeLevels() {
    const levels = [];
    for (let i = 1; i <= 50; i++) {
      const goal = Math.round(6 + (i - 1) * 2.2 + Math.pow(i, 1.25) * 0.4);
      const time = i <= 10 ? 30 : (i <= 25 ? 28 : (i <= 40 ? 26 : 24));
      const baseSize = Math.max(48, 70 - Math.floor(i * 0.4));
      const minSize  = Math.max(24, 44 - Math.floor(i * 0.3));
      let bombChance = 0;
      if (i >= 10) bombChance = Math.min(0.45, 0.12 + (i - 10) * 0.008);
      levels.push({ level: i, goal, time, baseSize, minSize, bombChance });
    }
    return levels;
  }
  const LEVELS = makeLevels();

  let currentLevel = 1;
  let score = 0;
  let timeLeft = 30;
  let combo = 0;
  let comboMult = 1;
  let timer = null;
  let running = false;
  let paused = false;
  let lastHit = 0;

  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
  function effectiveVolume() { return settings.muted ? 0 : settings.volume; }
  function playTone(freq, duration, type = 'sine', gainVal = 0.15, slideTo = null) {
    const vol = effectiveVolume();
    if (!audioCtx || vol <= 0) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(gainVal * vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  const sfx = {
    hit: (lvl) => { const base = 440 + Math.min(lvl, 10) * 60; playTone(base, 0.12, 'triangle', 0.18); playTone(base * 1.5, 0.08, 'sine', 0.1); },
    start: () => { playTone(330, 0.1, 'square', 0.1); setTimeout(()=>playTone(494, 0.15,'square',0.1),100); },
    win:   () => { playTone(523,0.12,'sine',0.15); setTimeout(()=>playTone(659,0.12,'sine',0.15),110); setTimeout(()=>playTone(784,0.2,'sine',0.15),220); },
    lose:  () => { playTone(330,0.2,'sawtooth',0.12, 200); setTimeout(()=>playTone(200,0.4,'sawtooth',0.12,120),200); },
    combo: () => { playTone(660, 0.1,'sine',0.15); setTimeout(()=>playTone(880,0.12,'sine',0.15),90); },
    pause: () => playTone(300, 0.1, 'square', 0.1),
    tick:  () => playTone(880, 0.05, 'sine', 0.06),
    bomb:  () => { playTone(120, 0.4, 'sawtooth', 0.3, 40); playTone(80, 0.5, 'square', 0.2, 30); },
    ui:    () => playTone(520, 0.06, 'sine', 0.1),
  };

  function spawnEffect(x, y, text, bad = false) {
    const pop = document.createElement('div');
    pop.className = 'pop' + (bad ? ' bad' : '');
    pop.textContent = text; pop.style.left = x + 'px'; pop.style.top = y + 'px';
    arena.appendChild(pop); setTimeout(() => pop.remove(), 700);
    if (!bad) {
      const flash = document.createElement('div');
      flash.className = 'flash'; flash.style.left = x + 'px'; flash.style.top = y + 'px';
      flash.style.width = '80px'; flash.style.height = '80px';
      arena.appendChild(flash); setTimeout(() => flash.remove(), 400);
    }
  }
  function spawnExplosion(x, y) {
    const ex = document.createElement('div');
    ex.className = 'explosion'; ex.style.left = x + 'px'; ex.style.top = y + 'px';
    ex.style.width = '90px'; ex.style.height = '90px';
    arena.appendChild(ex); setTimeout(() => ex.remove(), 500);
  }

  let bombEl = null; let bombTimeout = null;
  function clearBomb() { if (bombEl) { bombEl.remove(); bombEl = null; } if (bombTimeout) { clearTimeout(bombTimeout); bombTimeout = null; } }
  function levelCfg() { return LEVELS[currentLevel - 1]; }

  function maybeSpawnBomb() {
    const c = levelCfg();
    if (!running || paused || c.bombChance <= 0) return;
    clearBomb();
    if (Math.random() > c.bombChance) { bombTimeout = setTimeout(maybeSpawnBomb, 900 + Math.random() * 900); return; }
    const size = 46;
    bombEl = document.createElement('div'); bombEl.className = 'bomb'; bombEl.textContent = '💣';
    bombEl.style.width = size + 'px'; bombEl.style.height = size + 'px';
    const maxX = arena.clientWidth - size; const maxY = arena.clientHeight - size;
    bombEl.style.left = Math.random() * maxX + 'px'; bombEl.style.top  = Math.random() * maxY + 'px';
    bombEl.addEventListener('mousedown', onBombHit); bombEl.addEventListener('touchstart', onBombHit, { passive: false });
    arena.appendChild(bombEl);
    bombTimeout = setTimeout(() => { clearBomb(); if (running && !paused) maybeSpawnBomb(); }, 2500 + Math.random() * 1500);
  }

  function onBombHit(e) {
    if (!running || paused) return;
    e.preventDefault(); e.stopPropagation();
    const rect = arena.getBoundingClientRect();
    spawnExplosion(e.clientX - rect.left, e.clientY - rect.top); spawnEffect(e.clientX - rect.left, e.clientY - rect.top, '💥 -5', true); sfx.bomb();
    score = Math.max(0, score - 5); scoreEl.textContent = score;
    combo = 0; comboMult = 1; comboBadge.classList.remove('show');
    clearBomb(); if (running && !paused) bombTimeout = setTimeout(maybeSpawnBomb, 800);
  }

  function moveTarget() {
    const c = levelCfg(); const progressRatio = 1 - (timeLeft / c.time);
    const size = Math.max(c.minSize, c.baseSize - progressRatio * (c.baseSize - c.minSize));
    target.style.width = size + 'px'; target.style.height = size + 'px';
    const maxX = arena.clientWidth - size; const maxY = arena.clientHeight - size;
    target.style.left = Math.random() * maxX + 'px'; target.style.top  = Math.random() * maxY + 'px';
    if (c.bombChance > 0) maybeSpawnBomb();
  }

  function startLevel(n) {
    currentLevel = n; const c = LEVELS[n - 1];
    initAudio(); sfx.start();
    score = 0; timeLeft = c.time; combo = 0; comboMult = 1;
    running = true; paused = false;
    overlay.classList.add('hidden');
    scoreEl.textContent = 0; goalEl.textContent = c.goal; levelEl.textContent = n;
    timeEl.textContent = c.time; timebar.style.width = '100%';
    comboBadge.classList.remove('show');
    target.style.display = 'block';
    pauseBtn.textContent = '⏸ Пауза';
    moveTarget(); clearBomb();
    if (c.bombChance > 0) bombTimeout = setTimeout(maybeSpawnBomb, 1200);
    clearInterval(timer);
    timer = setInterval(() => {
      if (paused) return;
      timeLeft--; timeEl.textContent = timeLeft;
      timebar.style.width = (timeLeft / c.time * 100) + '%';
      if (timeLeft <= 5 && timeLeft > 0) sfx.tick();
      if (timeLeft <= 0) endLevel();
    }, 1000);
  }

  function endLevel() {
    clearInterval(timer); clearBomb(); running = false; target.style.display = 'none';
    const c = LEVELS[currentLevel - 1]; const passed = score >= c.goal;

    if (currentUser) {
      if (score > (progress.best[currentLevel] || 0)) progress.best[currentLevel] = score;
      if (passed && progress.unlocked <= currentLevel && currentLevel < 50) progress.unlocked = currentLevel + 1;
      if (passed && currentLevel === 50) progress.unlocked = 50;
      saveUserDataToDB(); 
    }

    if (passed) {
      sfx.win(); const isLast = currentLevel === 50;
      overlay.innerHTML = `
        <h2>${isLast ? '🏆 Все 50 уровней пройдены!' : '✅ Уровень пройден!'}</h2>
        <p>Уровень ${currentLevel} · Очки</p>
        <div class="big">${score} / ${c.goal}</div>
        ${currentUser ? `<p>Рекорд уровня: <b>${progress.best[currentLevel]}</b></p>` : '<p>Войди, чтобы сохранять прогресс!</p>'}
        <div class="btnRow">
          ${!isLast ? `<button class="action-btn" id="nextBtn">Дальше →</button>` : ''}
          <button class="action-btn" id="againBtn" style="background:#0f3460;">Ещё раз</button>
          <button class="action-btn" id="menuBtn" style="background:#0f3460;">☰ Меню</button>
        </div>
      `;
      overlay.classList.remove('hidden');
      if (!isLast) document.getElementById('nextBtn').onclick = () => startLevel(currentLevel + 1);
      document.getElementById('againBtn').onclick = () => startLevel(currentLevel);
      document.getElementById('menuBtn').onclick = startMenu;
    } else {
      sfx.lose();
      overlay.innerHTML = `
        <h2 style="color:#e94560">❌ Не хватило очков</h2>
        <p>Уровень ${currentLevel} · Цель: ${c.goal}</p>
        <div class="big" style="color:#b0b8c8">${score} / ${c.goal}</div>
        <p>Не хватило <b style="color:#e94560">${c.goal - score}</b> очков</p>
        <div class="btnRow">
          <button class="action-btn" id="retryBtn">Ещё раз</button>
          <button class="action-btn" id="menuBtn" style="background:#0f3460;">☰ Меню</button>
        </div>
      `;
      overlay.classList.remove('hidden');
      document.getElementById('retryBtn').onclick = () => startLevel(currentLevel);
      document.getElementById('menuBtn').onclick = startMenu;
    }
  }

  function hit(e) {
    if (!running || paused) return;
    e.preventDefault();
    const now = Date.now(); const delta = now - lastHit; lastHit = now;
    if (delta < 700) combo++; else combo = 0;
    if (combo > 0 && combo % 3 === 0) {
      comboMult = Math.min(1 + Math.floor(combo / 3) * 0.5, 4); sfx.combo();
      comboBadge.textContent = `🔥 COMBO x${comboMult.toFixed(1)}`;
      comboBadge.classList.add('show');
    }
    const points = Math.round(1 * comboMult);
    score += points; scoreEl.textContent = score;
    const rect = arena.getBoundingClientRect();
    spawnEffect(e.clientX - rect.left, e.clientY - rect.top, '+' + points);
    sfx.hit(combo); moveTarget();
  }

  target.addEventListener('mousedown', hit);
  target.addEventListener('touchstart', hit, { passive: false });

  pauseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ Продолжить' : '⏸ Пауза';
    sfx.pause();
    if (paused) { overlay.innerHTML = `<h2>⏸ Пауза</h2><p>Отдохни немного 😌</p>`; overlay.classList.remove('hidden'); }
    else { overlay.classList.add('hidden'); }
  });

  function startMenu() {
    running = false; clearInterval(timer); clearBomb(); target.style.display = 'none';
    const cells = LEVELS.map(l => {
      const unlocked = l.level <= progress.unlocked;
      const done = (progress.best[l.level] || 0) >= l.goal;
      const isCurrent = l.level === progress.unlocked;
      let cls = 'lvl';
      if (!unlocked) cls += ' locked'; else if (done) cls += ' done'; else if (isCurrent) cls += ' current';
      const bombMark = l.bombChance > 0 ? '<span class="bombMark">💣</span>' : '';
      return `<div class="${cls}" data-level="${l.level}">${l.level}${bombMark}</div>`;
    }).join('');

    overlay.innerHTML = `
      <h2 style="margin-top:10px;">🎯 Поймай квадрат</h2>
      <p>С 10-го уровня появляются 💣 бомбы (−5 очков).</p>
      ${!currentUser ? `<p style="color:#e94560; font-size:0.8rem; margin-top:-4px;">Войди в аккаунт (справа вверху), чтобы сохранять прогресс!</p>` : ''}
      <div class="settings">
        <div class="row">
          <label>Громкость</label>
          <div class="volume-wrap">
            <input type="range" id="volSlider" min="0" max="1" step="0.05" value="${settings.volume}">
            <span id="volVal">${Math.round(settings.volume*100)}%</span>
            <button id="muteBtn" title="Mute">${settings.muted ? '🔇' : '🔊'}</button>
          </div>
        </div>
      </div>
      <div id="levelGrid">${cells}</div>
      <div class="legend">
        <span><span class="dot" style="background:#1a5a3a;border:1px solid #4ecca3"></span>Пройден</span>
        <span><span class="dot" style="background:#e94560"></span>Текущий</span>
        <span><span class="dot" style="background:#0a1225;border:1px solid #3a4560"></span>Закрыт</span>
      </div>
      <button class="action-btn" id="playBtn" style="margin-top:10px; width:100%; max-width:380px;">▶ Играть уровень ${progress.unlocked}</button>
    `;
    overlay.classList.remove('hidden');

    const volSlider = document.getElementById('volSlider');
    const volVal = document.getElementById('volVal');
    volSlider.oninput = () => {
      settings.volume = Number(volSlider.value);
      volVal.textContent = Math.round(settings.volume*100) + '%';
      if (currentUser) saveUserDataToDB();
      if (!settings.muted) { initAudio(); playTone(600, 0.06, 'sine', 0.1); }
    };
    volSlider.onchange = () => sfx.ui();
    
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.onclick = () => {
      settings.muted = !settings.muted;
      if (currentUser) saveUserDataToDB();
      muteBtn.textContent = settings.muted ? '🔇' : '🔊';
      initAudio(); if (!settings.muted) sfx.ui();
    };

    overlay.querySelectorAll('.lvl').forEach(cell => {
      cell.onclick = () => {
        const lvl = Number(cell.dataset.level);
        if (lvl > progress.unlocked) { cell.style.borderColor = '#e94560'; setTimeout(() => cell.style.borderColor = 'transparent', 200); playTone(200, 0.1, 'sawtooth', 0.1); return; }
        sfx.ui(); startLevel(lvl);
      };
    });
    document.getElementById('playBtn').onclick = () => startLevel(progress.unlocked);
  }

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!running) return;
    paused = true;
    startMenu();
  });

  updateTopPanel();
  startMenu(); 

  const savedUser = localStorage.getItem('catchCurrentUser');
  if (savedUser) {
    fetchDB().then(() => {
      if (globalDB[savedUser]) {
        loginSuccess(savedUser, globalDB[savedUser]);
      }
    });
  }
</script>
</body>
</html>
